<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniVerify | Academic Blockchain Portal</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"
      type="application/javascript"
    ></script>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0d1117;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        background: rgba(255, 255, 255, 0.05);
        padding: 40px;
        border-radius: 20px;
        border: 1px solid rgba(88, 166, 255, 0.3);
        width: 100%;
        max-width: 500px;
        text-align: center;
        backdrop-filter: blur(10px);
      }
      h1 {
        color: #58a6ff;
        margin-bottom: 10px;
      }
      p {
        color: #8b949e;
        margin-bottom: 30px;
      }
      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 8px;
        border: 1px solid #30363d;
        background: #161b22;
        color: white;
        font-size: 16px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background-color: #238636;
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 16px;
        transition: 0.3s;
      }
      button:hover {
        background-color: #2ea043;
        transform: translateY(-2px);
      }
      #result {
        margin-top: 25px;
        padding: 15px;
        border-radius: 8px;
        display: none;
      }
      .success {
        background: rgba(35, 134, 54, 0.15);
        border: 1px solid #238636;
        color: #3fb950;
      }
      .error {
        background: rgba(248, 81, 73, 0.15);
        border: 1px solid #f85149;
        color: #f85149;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>UniVerify V2.0</h1>
      <p>Decentralized Certificate Verification</p>

      <input
        type="text"
        id="regInput"
        placeholder="Enter Register Number (e.g. 2021CSE101)"
      />
      <button onclick="verifyCertificate()">Verify on Blockchain</button>

      <div id="result"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
